name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bunx tsc --noEmit
      - run: bun run build
        env:
          OPENAI_API_KEY: placeholder
          LLM_PROVIDER: openai
          LLM_MODEL: gpt-4o
          FAL_KEY: placeholder
          FAL_IMAGE_MODEL: fal-ai/flux/schnell
          GRADIUM_API_KEY: placeholder
